name: Deploy Upload Lambda

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/upload-lambda/**'
      - '.github/workflows/deploy-upload.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd backend/upload-lambda
          if [ -f package.json ]; then npm install; fi

      - name: Package Lambda into ZIP
        run: |
          cd backend/upload-lambda
          zip -r upload-${{ github.sha }}.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-1

      - name: Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name datapipe-upload-lab \
            --zip-file fileb://backend/upload-lambda/upload-${{ github.sha }}.zip

      - name: Wait for Lambda update to finish
        run: |
          aws lambda wait function-updated --function-name datapipe-upload-lab

      - name: Publish Version & Update Live Alias
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          CLEAN_MSG=$(echo "$COMMIT_MSG" | tr "'" " ")
          VERSION=$(aws lambda publish-version --function-name datapipe-upload-lab --description "$CLEAN_MSG" --query 'Version' --output text)
          aws lambda update-alias --function-name datapipe-upload-lab --name live --function-version $VERSION